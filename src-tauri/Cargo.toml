[package]
name = "velo-file-manager"
version = "0.1.0"
description = "Extremely clean and fast translucent Windows file manager"
authors = ["Velo"]
edition = "2021"

[lib]
name = "velo_file_manager_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
window-vibrancy = "0.6"
trash = "5"
walkdir = "2"
notify = "7"
zip = { version = "2", default-features = false, features = ["deflate"] }
dirs = "6"
sysinfo = "0.33"
open = "5"
png = "0.17"
base64 = "0.22"
